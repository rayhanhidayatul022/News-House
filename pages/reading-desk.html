<section class="desk-page desk-page--read" id="reading-desk" aria-label="Meja Baca" hidden>
  <div class="desk-page__stage">
    <button class="button button--round desk-page__home" type="button" aria-label="Kembali ke beranda" title="Beranda"><span class="sr-only">Beranda</span></button>
    <button class="button desk-page__back" type="button" aria-label="Kembali ke Ruang Redaksi" title="Kembali ke Ruang Redaksi"><span class="sr-only">Kembali ke Ruang Redaksi</span></button>
    <img class="desk-page__identity reading-desk__title" src="assets/images/reading-desk/title.png" alt="Meja Baca">

    <div class="reading-desk__content">
      <section class="reading-desk__view is-appearing" id="reading-material" aria-label="Materi ADIKSIMBA">
        <img src="assets/images/reading-desk/adiksimba.png" alt="ADIKSIMBA adalah singkatan dari Apa, Di mana, Kapan, Siapa, Mengapa, dan Bagaimana">
      </section>
      <section class="reading-desk__view" id="reading-example" aria-label="Contoh berita banjir Pekanbaru" hidden>
        <img src="assets/images/reading-desk/flood-news.png" alt="Contoh berita banjir di Pekanbaru dari Tribunpekanbaru.com">
      </section>
    </div>

    <div class="reading-desk__actions">
      <button class="reading-desk__toggle" id="reading-toggle" type="button" aria-label="Buka contoh berita" aria-pressed="false">
        <img id="reading-toggle-image" src="assets/images/reading-desk/example-button.png" alt="">
      </button>
      <button class="reading-desk__dissection" id="dissection-room-button" type="button" aria-label="Mari ke Ruang Bedah" title="Mari ke Ruang Bedah">
        <img src="assets/images/reading-desk/dissection-room-button.png" alt="">
      </button>
    </div>
  </div>
</section>
