<section class="mission-room" id="mission-room" aria-label="Ruang Misi" hidden>
  <div class="mission-room__stage">
    <button class="button button--round mission-room__home" type="button" aria-label="Kembali ke beranda" title="Beranda"><span class="sr-only">Beranda</span></button>
    <button class="button mission-room__back" type="button" aria-label="Kembali ke Hasil Bedah" title="Kembali ke Hasil Bedah"><span class="sr-only">Kembali ke Hasil Bedah</span></button>

    <img class="mission-room__header" src="assets/images/mission-room/header.png" alt="Ruang Misi — Buktikan hasil penyelidikanmu">

    <div class="mission-room__cards" aria-label="Pilih misi berdasarkan meja yang telah dibuka">
      <button class="mission-card" type="button" data-mission-desk="reading-desk" data-mission-target="reading-mission" aria-label="Misi Meja Baca terkunci" aria-disabled="true">
        <img src="assets/images/mission-room/reading-locked.png" data-active-src="assets/images/mission-room/reading-active.png" data-locked-src="assets/images/mission-room/reading-locked.png" alt="Misi Meja Baca">
      </button>
      <button class="mission-card" type="button" data-mission-desk="observation-desk" data-mission-target="observation-mission" aria-label="Misi Meja Amati terkunci" aria-disabled="true">
        <img src="assets/images/mission-room/observation-locked.png" data-active-src="assets/images/mission-room/observation-active.png" data-locked-src="assets/images/mission-room/observation-locked.png" alt="Misi Meja Amati">
      </button>
      <button class="mission-card" type="button" data-mission-desk="listening-desk" data-mission-target="listening-mission" aria-label="Misi Meja Simak terkunci" aria-disabled="true">
        <img src="assets/images/mission-room/listening-locked.png" data-active-src="assets/images/mission-room/listening-active.png" data-locked-src="assets/images/mission-room/listening-locked.png" alt="Misi Meja Simak">
      </button>
    </div>
  </div>
</section>
