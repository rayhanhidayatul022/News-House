<section class="listening-dissection" id="listening-dissection" aria-label="Ruang Bedah Audio" hidden>
  <div class="listening-dissection__stage">
    <button class="button button--round listening-dissection__home" type="button" aria-label="Kembali ke beranda" title="Beranda"><span class="sr-only">Beranda</span></button>
    <button class="button listening-dissection__back" type="button" aria-label="Kembali ke Meja Simak" title="Kembali ke Meja Simak"><span class="sr-only">Kembali ke Meja Simak</span></button>
    <button class="listening-dissection__play" type="button" aria-label="Putar audio bedah" aria-pressed="false">
      <img src="assets/images/listening-dissection/play-button.png" alt="Play audio">
      <span class="listening-dissection__pause-icon" aria-hidden="true"></span>
    </button>
    <audio id="listening-dissection-audio" preload="metadata"><source src="assets/audio/listening-dissection.mp3" type="audio/mpeg"></audio>
    <p class="sr-only listening-dissection__status" aria-live="polite">Tekan tombol play untuk mendengarkan audio bedah.</p>
    <button class="listening-dissection__expression" type="button" aria-label="Buka Ruang Ekspresi Meja Simak">
      <img src="assets/images/listening-dissection/expression-button.png" alt="Ruang Ekspresi">
    </button>
  </div>
</section>
