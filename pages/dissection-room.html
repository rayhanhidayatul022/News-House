<section class="dissection-room" id="dissection-room" aria-label="Ruang Bedah Teks" hidden>
  <div class="dissection-room__stage">
    <button class="button button--round dissection-room__home" type="button" aria-label="Kembali ke beranda" title="Beranda"><span class="sr-only">Beranda</span></button>
    <button class="button dissection-room__back" type="button" aria-label="Kembali ke Meja Baca" title="Kembali ke Meja Baca"><span class="sr-only">Kembali ke Meja Baca</span></button>
    <img class="dissection-room__header" src="assets/images/dissection-room/header.png" alt="Ruang Bedah Teks. Baca kembali berita lengkap di sebelah kiri. Temukan unsur ADIKSIMBA dari berita tersebut!">
    <section class="dissection-room__news" aria-label="Berita dugaan perundungan siswa SD di Pemalang">
      <img src="assets/images/dissection-room/pemalang-news.png" alt="Polisi dalami dugaan perundungan siswa SD di Pemalang">
    </section>
    <section class="dissection-room__instructions" aria-label="Petunjuk pelaksanaan">
      <img src="assets/images/dissection-room/instructions.png" alt="Petunjuk pelaksanaan membedah berita">
    </section>
    <section class="dissection-room__worksheet" aria-label="Panel ADIKSIMBA">
      <img src="assets/images/dissection-room/adiksimba-form.png" alt="Panel ADIKSIMBA dengan kolom jawaban kosong">
    </section>
    <button class="dissection-room__expression" id="expression-room-button" type="button" aria-label="Buka Ruang Ekspresi">
      <img src="assets/images/dissection-room/expression-button.png" alt="">
    </button>
  </div>
</section>
