<section class="mission-detail reading-mission" id="reading-mission" aria-label="Misi Meja Baca" hidden>
  <div class="reading-mission__stage">
    <button class="button button--round mission-detail__home reading-mission__home" type="button" aria-label="Kembali ke beranda" title="Beranda"><span class="sr-only">Beranda</span></button>
    <button class="button mission-detail__back reading-mission__back" type="button" aria-label="Kembali ke Ruang Misi" title="Kembali ke Ruang Misi"><span class="sr-only">Kembali ke Ruang Misi</span></button>
    <img class="reading-mission__board" src="assets/images/reading-mission/board.png" alt="Papan Misi Meja Baca berisi berita dan lima petunjuk tantangan editor">
    <div class="reading-mission__actions" aria-label="Aksi Misi Meja Baca">
      <a class="reading-mission__action button-link" href="https://drive.google.com/drive/folders/1J3xfa2oN5R9knGIPPLD984646M5y9tEE?usp=drive_link" target="_blank" rel="noopener noreferrer" aria-label="Unggah jawaban ke Google Drive">
        <img src="assets/images/reading-mission/upload-button.png" alt="Unggah ke Google Drive">
      </a>
      <button class="reading-mission__action" id="complete-reading-mission" type="button" aria-label="Selesaikan Misi Meja Baca">
        <img src="assets/images/reading-mission/complete-button.png" alt="Selesaikan Misi">
      </button>
    </div>
    <div class="reading-success" id="reading-success" role="dialog" aria-modal="true" aria-label="Selamat, Misi Meja Baca telah selesai" hidden>
      <div class="reading-success__backdrop" aria-hidden="true"></div>
      <div class="reading-success__card">
        <img src="assets/images/reading-mission/success-modal.png" alt="Selamat! Misi telah selesai. Hebat, Detektif Berita!">
        <button class="reading-success__continue" type="button" aria-label="Lanjutkan ke Ruang Misi"><span class="sr-only">Lanjutkan</span></button>
      </div>
    </div>
  </div>
</section>
