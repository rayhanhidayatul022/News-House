<section class="observation-dissection" id="observation-dissection" aria-label="Ruang Bedah Visual" hidden>
  <div class="observation-dissection__stage">
    <button class="button button--round observation-dissection__home" type="button" aria-label="Kembali ke beranda" title="Beranda"><span class="sr-only">Beranda</span></button>
    <button class="button observation-dissection__back" type="button" aria-label="Kembali ke Meja Amati" title="Kembali ke Meja Amati"><span class="sr-only">Kembali ke Meja Amati</span></button>
    <img class="observation-dissection__header" src="assets/images/observation-dissection/header.png" alt="Ruang Bedah Visual. Amati setiap adegan. Analisis strukturnya!">
    <div class="observation-dissection__content">
      <section class="observation-dissection__instructions" aria-label="Petunjuk Ruang Bedah Visual"><img src="assets/images/observation-dissection/instructions.png" alt="Lima petunjuk untuk membedah video"></section>
      <section class="observation-dissection__video-frame" aria-label="Video yang dibedah">
        <video id="observation-dissection-video" controls preload="metadata" playsinline>
          <source src="assets/video/video-bedah.mp4" type="video/mp4">
          Browser kamu belum mendukung pemutaran video.
        </video>
      </section>
      <section class="observation-dissection__worksheet" aria-label="Papan ADIKSIMBA dengan kolom kosong"><img src="assets/images/observation-dissection/adiksimba.png" alt="Papan ADIKSIMBA dengan enam kolom jawaban kosong"></section>
    </div>
    <button class="observation-dissection__expression" id="observation-expression-button" type="button" aria-label="Buka Ruang Ekspresi Meja Amati"><img src="assets/images/observation-dissection/expression-button.png" alt="Ruang Ekspresi"></button>
  </div>
</section>
