<section class="onboarding" id="onboarding" aria-label="Pelajari misi" hidden>
  <button class="button button--round onboarding__home" id="home-button" aria-label="Kembali ke beranda" title="Beranda"><span class="sr-only">Beranda</span></button>
  <div class="dialogue">
    <div class="dialogue__header">PELAJARI MISI</div>
    <article class="paper" id="briefing-paper">
      <h1 id="briefing-title"></h1>
      <div class="briefing-copy" id="briefing-copy"></div>
      <div id="briefing-extras"></div>
      <nav class="briefing-controls" aria-label="Navigasi briefing">
        <button class="button button--arrow" id="previous-button" aria-label="Tahap sebelumnya"><span class="sr-only">Tahap sebelumnya</span></button>
        <div class="progress" id="progress" role="img" aria-label="Langkah 1 dari 3">
          <i aria-hidden="true">1</i><i aria-hidden="true">2</i><i aria-hidden="true">3</i>
        </div>
        <button class="button button--arrow" id="next-button" aria-label="Tahap selanjutnya"><span class="sr-only">Tahap selanjutnya</span></button>
      </nav>
    </article>
  </div>
</section>
