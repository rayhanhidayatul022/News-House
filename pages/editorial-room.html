<section class="editorial-room" id="editorial-room" aria-label="Ruang Redaksi" hidden>
  <div class="editorial-room__stage">
    <button class="button button--round editorial-room__home" id="room-home-button" aria-label="Kembali ke beranda" title="Beranda"><span class="sr-only">Beranda</span></button>

    <img class="editorial-room__title" src="assets/images/editorial-room/instruction-header.png" alt="Instruksi Sebelum Membedah">

    <div class="editorial-room__desks" aria-label="Pilihan meja redaksi">
      <button class="editorial-desk editorial-desk--read" type="button" data-desk-target="reading-desk" aria-label="Buka Meja Baca">
        <img src="assets/images/editorial-room/reading-desk.png" alt="Meja Baca — Aku ingin membaca">
      </button>
      <button class="editorial-desk editorial-desk--observe" type="button" data-desk-target="observation-desk" aria-label="Buka Meja Amati">
        <img src="assets/images/editorial-room/observation-desk.png" alt="Meja Amati — Aku ingin melihat">
      </button>
      <button class="editorial-desk editorial-desk--listen" type="button" data-desk-target="listening-desk" aria-label="Buka Meja Simak">
        <img src="assets/images/editorial-room/listening-desk.png" alt="Meja Simak — Aku ingin mendengarkan">
      </button>
    </div>

    <aside class="editorial-room__guide" aria-label="Petunjuk Redaksi">
      <img src="assets/images/editorial-room/editorial-guide.png" alt="Petunjuk Redaksi: perhatikan siapa, apa, kapan, di mana, mengapa, dan bagaimana dalam berita">
    </aside>
  </div>
</section>
