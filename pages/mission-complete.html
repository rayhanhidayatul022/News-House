<section class="mission-complete" id="mission-complete" aria-label="Misi selesai" hidden>
  <div class="mission-complete__stage">
    <p class="mission-complete__message" id="mission-complete-message" aria-live="polite"></p>
    <div class="mission-complete__primary-actions">
      <button class="mission-complete__image-button" id="mission-complete-choose-desk" type="button" aria-label="Pilih Meja">
        <img src="assets/images/mission-complete/choose-desk-button.png" alt="Pilih Meja">
      </button>
      <button class="mission-complete__image-button" id="mission-complete-finish" type="button" aria-label="Selesaikan Pembelajaran">
        <img src="assets/images/mission-complete/finish-learning-button.png" alt="Selesaikan Pembelajaran">
      </button>
    </div>
    <div class="mission-complete__final-modal" id="mission-complete-final-modal" role="dialog" aria-modal="true" aria-label="Pembelajaran telah selesai" hidden>
      <div class="mission-complete__final-backdrop" aria-hidden="true"></div>
      <img src="assets/images/mission-complete/learning-finished-modal.png" alt="Pembelajaran telah selesai. Selamat, Anda telah berhasil menjadi detektif berita sekarang">
    </div>
  </div>
</section>
